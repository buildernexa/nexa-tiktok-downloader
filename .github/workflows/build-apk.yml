name: Build Nexa APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx cap sync android
      - name: Inject versionCode
        run: |
          python3 - << 'PY'
          import re, os
          p = 'android/app/build.gradle'
          with open(p) as f: s = f.read()
          s = re.sub(r'versionCode\s+\d+', f'versionCode {int(os.environ.get("GITHUB_RUN_NUMBER","1"))}', s)
          with open(p,'w') as f: f.write(s)
          PY
      - name: Build APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon
      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-hub-v${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

name: Build Nexa-TikTok APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Inject versionCode from run number
        run: |
          python3 - << 'PY'
          import re, os
          p = 'android/app/build.gradle'
          code = int(os.environ.get('GITHUB_RUN_NUMBER', '1'))
          with open(p) as f: s = f.read()
          s = re.sub(r'versionCode\s+\d+', f'versionCode {code}', s)
          with open(p, 'w') as f: f.write(s)
          print(f'versionCode = {code}')
          PY

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-tiktok-v${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          overwrite: true

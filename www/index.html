<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#f5c518" />
<title>Nexa Hub</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- SVG SPRITE -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M17 10l4-3v10l-4-3z"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></symbol>
    <symbol id="i-cover" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></symbol>
    <symbol id="i-slide" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 9l4 3-4 3z" fill="currentColor"/></symbol>
    <symbol id="i-frame" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><rect x="8" y="8" width="8" height="8" rx="1"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM19 19h2M21 14h-2M17 21v-2"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1.5 1.5"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1.5-1.5"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 14v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z" fill="currentColor"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand">
    <div class="logo"><svg><use href="#i-logo"/></svg></div>
    <span class="brand-name">Nexa Hub</span>
  </div>
  <div class="status-pill"><span class="dot"></span><span id="status-label">Ready</span></div>
</header>

<main class="page">

  <section class="card input-card">
    <form id="dl-form">
      <div class="input-wrap">
        <input type="url" id="url" placeholder="TikTok URL" required autocomplete="off" spellcheck="false" />
        <button type="button" id="paste-btn" class="icon-btn" aria-label="Paste"><svg><use href="#i-paste"/></svg></button>
      </div>

      <div class="toolbar" id="main-actions">
        <button type="button" class="chip active" data-action="download-video"><svg><use href="#i-video"/></svg><span>Video</span></button>
        <button type="button" class="chip" data-action="download-audio"><svg><use href="#i-audio"/></svg><span>MP3</span></button>
        <button type="button" class="chip" data-action="download-cover"><svg><use href="#i-cover"/></svg><span>Cover</span></button>
        <button type="button" class="chip" data-action="download-slideshow"><svg><use href="#i-slide"/></svg><span>Slide</span></button>
      </div>

      <button type="submit" id="dl-btn" class="btn-primary">
        <svg><use href="#i-play"/></svg>
        <span class="btn-label">Execute</span>
      </button>
    </form>
  </section>

  <section class="card result-card hidden" id="result">
    <div class="result-head">
      <span class="pill" id="mode-pill">—</span>
      <button class="icon-btn" id="close-result" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </div>

    <div class="preview-area">
      <video id="video-player" class="hidden" controls playsinline preload="metadata"></video>
      <audio id="audio-player" class="hidden" controls></audio>
      <div class="cover-preview-wrap">
        <img id="cover-img" class="hidden" alt="" />
        <div id="cover-ph" class="cover-ph"><svg><use href="#i-cover"/></svg></div>
      </div>
    </div>

    <div class="meta">
      <p class="meta-title" id="title">—</p>
      <p class="meta-author" id="author">@—</p>
    </div>

    <div class="result-actions">
      <button id="save-btn" class="btn-primary"><svg><use href="#i-download"/></svg><span class="btn-label">Save</span></button>
      <button id="copy-link" class="btn-ghost"><svg><use href="#i-copy"/></svg><span>Copy</span></button>
    </div>
  </section>

  <section class="grid">
    <button class="tile" id="btn-frames"><svg><use href="#i-frame"/></svg><span class="tile-label">Frame</span></button>
    <button class="tile" id="btn-qr"><svg><use href="#i-qr"/></svg><span class="tile-label">QR</span></button>
    <button class="tile" id="btn-link-extract"><svg><use href="#i-link"/></svg><span class="tile-label">Extract</span></button>
    <button class="tile" id="btn-history"><svg><use href="#i-history"/></svg><span class="tile-label">History</span></button>
    <button class="tile" id="btn-theme"><svg><use href="#i-theme"/></svg><span class="tile-label">Theme</span></button>
    <button class="tile" id="btn-clear"><svg><use href="#i-clear"/></svg><span class="tile-label">Clear</span></button>
  </section>

  <section class="card hidden" id="frames-card">
    <div class="result-head">
      <span class="pill">Frame Grabber</span>
      <button class="icon-btn" id="close-frames"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="canvas-wrap"><canvas id="frame-canvas"></canvas></div>
    <div class="result-actions">
      <button id="btn-take-frame" class="btn-primary"><svg><use href="#i-frame"/></svg><span>Capture</span></button>
      <button id="btn-save-frame" class="btn-ghost hidden"><svg><use href="#i-download"/></svg><span>Save</span></button>
    </div>
  </section>

  <section class="card hidden" id="history-card">
    <div class="result-head">
      <span class="pill">Recent</span>
      <button class="icon-btn" id="close-history"><svg><use href="#i-close"/></svg></button>
    </div>
    <ul id="history-list" class="history-list"></ul>
  </section>

</main>

<div class="toast hidden" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
